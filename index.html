<head>

<title>오늘 점메추</title>
<style>
  :root {
    --bg: #faf6ef; --card: #ffffff; --ink: #2b2420; --muted: #8a7f76;
    --line: #ebe2d6; --accent: #e8552e; --accent-ink: #fff; --chip: #f3ebe0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1816; --card: #26221f; --ink: #f2ebe4; --muted: #a39890;
            --line: #3a332e; --accent: #ff6a3d; --chip: #332d29; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.5px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  section { margin-bottom: 14px; }
  .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--chip); color: var(--ink);
          padding: 6px 12px; border-radius: 999px; font-size: 14px; cursor: pointer; }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .count { color: var(--muted); font-size: 13px; margin: 18px 0 10px; }
  .go { width: 100%; padding: 18px; font-size: 20px; font-weight: 800; border: 0;
        border-radius: 16px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .go:disabled { opacity: .4; cursor: default; }
  .result { margin-top: 18px; background: var(--card); border: 1px solid var(--line);
            border-radius: 18px; padding: 20px; min-height: 120px; }
  .result.empty { display: grid; place-items: center; color: var(--muted); text-align: center; }
  .rname { font-size: 26px; font-weight: 800; margin: 2px 0 6px; letter-spacing: -0.5px; }
  .rolling .rname { color: var(--muted); }
  .cat { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 6px;
         background: var(--chip); color: var(--muted); }
  .row { display: flex; gap: 8px; margin: 6px 0; font-size: 14px; }
  .row b { min-width: 56px; color: var(--muted); font-weight: 600; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .btn { flex: 1; min-width: 120px; text-align: center; padding: 10px; border-radius: 10px;
         border: 1px solid var(--line); background: var(--chip); color: var(--ink);
         font-size: 14px; text-decoration: none; cursor: pointer; }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  details { margin-top: 22px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 8px; font-weight: 700; }
  .cal-head button { background: var(--chip); border: 1px solid var(--line); color: var(--ink);
                     border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal .dow { text-align: center; font-size: 11px; color: var(--muted); padding: 2px 0; }
  .cal .day { min-height: 58px; border: 1px solid var(--line); border-radius: 8px; padding: 3px;
              background: var(--card); cursor: pointer; overflow: hidden; }
  .cal .day.blank { visibility: hidden; }
  .cal .day.today { border-color: var(--accent); }
  .cal .day.sel { outline: 2px solid var(--ink); }
  .cal .num { font-size: 11px; color: var(--muted); }
  .cal .meal { font-size: 10px; line-height: 1.25; background: var(--chip); border-radius: 4px; padding: 1px 3px;
               margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist { list-style: none; padding: 0; margin: 8px 0 0; font-size: 14px; }
  .hist li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .hist button { background: none; border: 0; color: var(--muted); cursor: pointer; }
  .note { color: var(--muted); font-size: 12px; margin-top: 20px; }
  .search { width: 100%; margin: 10px 0 8px; padding: 10px 12px; font-size: 15px; border-radius: 10px;
            border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .list { list-style: none; padding: 0; margin: 8px 0 0; }
  .list li { padding: 10px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .list li:hover { background: var(--chip); }
  .list .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
  .list .meta { font-size: 13px; color: var(--muted); }
  .list .off { opacity: .45; }
</style>

    <div class="cal" id="cal"></div>

const DAYS = ["일","월","화","수","목","금","토"];
const PRICE = { 1: "~1만원", 2: "1~1.5만원", 3: "1.5만원+" };
const TAG = { wait: "⏳ 점심 웨이팅", solo: "🙋 혼밥 OK", group: "👥 단체·룸" };
const RECENT_DAYS = 3;

const state = {
  cats: new Set(),           // 비어 있으면 전체
  walk: 10,                  // 분, 0이면 전체
  prices: new Set(),
  opts: new Set(["open", "recent"]),
};

// ---- 최근 먹은 곳 (브라우저 저장소, 실패해도 동작) ----
let eaten = [];
try { eaten = JSON.parse(localStorage.getItem("jmc-eaten") || "[]"); } catch (e) {}
function saveHistory() { try { localStorage.setItem("jmc-eaten", JSON.stringify(eaten)); } catch (e) {} }
function recentNames() {
  const cutoff = Date.now() - RECENT_DAYS * 86400000;
  return new Set(eaten.filter(h => h.t >= cutoff).map(h => h.n));
}

// ---- 필터 ----
function candidates() {
  const today = new Date().getDay();
  const recent = recentNames();
  return DATA.filter(r =>
    (!state.cats.size || state.cats.has(r.c)) &&
    (!state.walk || r.w <= state.walk) &&
    (!state.prices.size || state.prices.has(r.p)) &&
    (!state.opts.has("open") || !r.closed.includes(today)) &&
    (!state.opts.has("recent") || !recent.has(r.n)) &&
    (!state.opts.has("nowait") || !r.tags.includes("wait")) &&
    (!state.opts.has("solo") || r.tags.includes("solo")) &&
    (!state.opts.has("group") || r.tags.includes("group"))
  );
}

// ---- 칩 UI ----
function chips(el, list, isOn, onClick) {
  el.innerHTML = "";
  list.forEach(([key, text]) => {
    const b = document.createElement("button");
    b.className = "chip" + (isOn(key) ? " on" : "");
    b.textContent = text;
    b.onclick = () => { onClick(key); render(); };
    el.appendChild(b);
  });
}
function toggle(set, key) { set.has(key) ? set.delete(key) : set.add(key); }

function render() {
  const cats = ["한식", "중식", "일식", "양식", "분식·기타"];
  chips(cat, [["", "전체"], ...cats.map(c => [c, c])],
    k => k === "" ? !state.cats.size : state.cats.has(k),
    k => k === "" ? state.cats.clear() : toggle(state.cats, k));
  chips(walk, [[5, "5분 이내"], [10, "10분 이내"], [0, "전체"]],
    k => state.walk === k, k => state.walk = k);
  chips(price, [[1, PRICE[1]], [2, PRICE[2]], [3, PRICE[3]]],
    k => state.prices.has(k), k => toggle(state.prices, k));
  chips(opt, [["open", `오늘(${DAYS[new Date().getDay()]}) 영업`], ["recent", `최근 ${RECENT_DAYS}일 먹은 곳 제외`],
              ["nowait", "웨이팅 없는 곳"], ["solo", "혼밥"], ["group", "단체"]],
    k => state.opts.has(k), k => toggle(state.opts, k));

  const n = candidates().length;
  count.textContent = `후보 ${n}곳 / 전체 ${DATA.length}곳`;
  go.disabled = n === 0;
  renderHistory();
  renderList();
}

// ---- 전체 리스트 ----
const listState = { onlyFiltered: false, sort: "w" };
function renderList() {
  chips(lopt, [["f", "현재 필터만"], ["w", "거리순"], ["r", "평점순"], ["n", "이름순"]],
    k => k === "f" ? listState.onlyFiltered : listState.sort === k,
    k => k === "f" ? (listState.onlyFiltered = !listState.onlyFiltered) : (listState.sort = k));
  const today = new Date().getDay();
  const q = document.getElementById("q").value.trim();
  const sorter = { w: (a, b) => a.w - b.w, r: (a, b) => b.r - a.r, n: (a, b) => a.n.localeCompare(b.n, "ko") }[listState.sort];
  const rows = (listState.onlyFiltered ? candidates() : DATA.slice())
    .filter(r => !q || r.n.includes(q) || r.m.includes(q) || r.c.includes(q))
    .sort(sorter);
  lcount.textContent = rows.length;
  list.innerHTML = rows.length ? "" : "<li>검색 결과가 없어요</li>";
  rows.forEach(r => {
    const li = document.createElement("li");
    const off = r.closed.includes(today);
    li.innerHTML = `<div class="${off ? "off" : ""}">
      <div class="top"><span>${r.n}</span><span class="meta">도보 ${r.w}분</span></div>
      <div class="meta">${r.c} · ${r.m} · ${PRICE[r.p]} · ★${r.r.toFixed(1)}${off ? " · 오늘 휴무" : ""}</div></div>`;
    li.onclick = () => { show(r); result.scrollIntoView({ behavior: "smooth", block: "center" }); };
    list.appendChild(li);
  });
}

// ---- 먹은 곳 달력 ----
const now = new Date();
const cal_ = { y: now.getFullYear(), m: now.getMonth(), sel: dayKey(now) };
function dayKey(d) { return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
function mealsOn(key) { return eaten.map((h, i) => ({ ...h, i })).filter(h => dayKey(new Date(h.t)) === key); }

function renderHistory() {
  hcount.textContent = eaten.length;
  calTitle.textContent = `${cal_.y}년 ${cal_.m + 1}월`;
  cal.innerHTML = DAYS.map(d => `<div class="dow">${d}</div>`).join("");
  const first = new Date(cal_.y, cal_.m, 1).getDay();
  const last = new Date(cal_.y, cal_.m + 1, 0).getDate();
  for (let i = 0; i < first; i++) cal.insertAdjacentHTML("beforeend", `<div class="day blank"></div>`);
  for (let d = 1; d <= last; d++) {
    const key = `${cal_.y}-${cal_.m + 1}-${d}`;
    const cell = document.createElement("div");
    cell.className = "day" + (key === dayKey(new Date()) ? " today" : "") + (key === cal_.sel ? " sel" : "");
    cell.innerHTML = `<div class="num">${d}</div>` + mealsOn(key).map(h => `<div class="meal">${h.n}</div>`).join("");
    cell.onclick = () => { cal_.sel = key; renderHistory(); };
    cal.appendChild(cell);
  }

  const [y, m, d] = cal_.sel.split("-");
  const meals = mealsOn(cal_.sel);
  selTitle.textContent = `${m}월 ${d}일 (${DAYS[new Date(y, m - 1, d).getDay()]})`;
  hist.innerHTML = meals.length ? "" : "<li>이 날은 기록이 없어요</li>";
  meals.forEach(h => {
    const li = document.createElement("li");
    li.innerHTML = `<span>${h.n}</span>`;
    const x = document.createElement("button");
    x.textContent = "삭제";
    x.onclick = () => { eaten.splice(h.i, 1); saveHistory(); render(); };
    li.appendChild(x);
    hist.appendChild(li);
  });
}
prevM.onclick = () => { if (--cal_.m < 0) { cal_.m = 11; cal_.y--; } renderHistory(); };
nextM.onclick = () => { if (++cal_.m > 11) { cal_.m = 0; cal_.y++; } renderHistory(); };

// ---- 룰렛 ----
let picked = null;
function spin() {
  const list = candidates();
  if (!list.length) return;
  go.disabled = true;
  result.className = "result rolling";
  let i = 0, delay = 40;
  const final = list[Math.floor(Math.random() * list.length)];
  (function tick() {
    const r = i > 18 ? final : list[Math.floor(Math.random() * list.length)];
    result.innerHTML = `<span class="cat">${r.c}</span><div class="rname">${r.n}</div>`;
    if (i++ > 18) { show(final); go.disabled = false; return; }
    delay *= 1.15;
    setTimeout(tick, delay);
  })();
}

function show(r) {
  picked = r;
  const today = new Date().getDay();
  const closed = r.closed.length ? r.closed.map(d => DAYS[d]).join("·") + " 점심 휴무" : "매일 점심 영업";
  const gmap = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.n)}&query_place_id=${r.pid}`;
  const nmap = `https://map.naver.com/p/search/${encodeURIComponent(r.n)}`;
  result.className = "result";
  result.innerHTML = `
    <span class="cat">${r.c}</span>
    <div class="rname">${r.n}</div>
    <div class="row"><b>메뉴</b><span>${r.m}</span></div>
    <div class="row"><b>가격대</b><span>${PRICE[r.p]}</span></div>
    <div class="row"><b>거리</b><span>도보 약 ${r.w}분 (${r.d}m)</span></div>
    <div class="row"><b>영업</b><span>${r.hu ? "영업시간 정보 없음 · 확인 필요" : closed}${r.closed.includes(today) ? " ⚠️ 오늘 휴무" : ""}</span></div>
    <div class="row"><b>평점</b><span>★ ${r.r.toFixed(1)} (Google)</span></div>
    <div class="tags">${r.tags.map(t => `<span class="tag">${TAG[t]}</span>`).join("")}</div>
    <div class="actions">
      <a class="btn" href="${nmap}" target="_blank" rel="noopener">네이버 지도</a>
      <a class="btn" href="${gmap}" target="_blank" rel="noopener">Google 지도</a>
    </div>
    <div class="actions">
      <button class="btn" id="again">다시 뽑기</button>
      <button class="btn primary" id="decide">여기로 결정!</button>
    </div>`;
  again.onclick = spin;
  decide.onclick = () => {
    eaten.push({ n: r.n, t: Date.now() });
    saveHistory();
    decide.textContent = "기록했어요 ✓";
    decide.disabled = true;
    render();
  };
}

go.onclick = spin;
document.getElementById("q").oninput = renderList;
render();
</script>
</body>
